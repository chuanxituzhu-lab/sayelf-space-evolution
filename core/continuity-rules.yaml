prime_rule: "Completion changes; space does not."
locks:
  camera: strict
  perspective: strict
  geometry: strict
  openings: strict
  anchors: strict
allowed_changes:
  - line_cleanup
  - geometry_clarification_without_relayout
  - structural_thickness
  - materials
  - lighting
  - furniture_detail
  - vegetation
  - atmosphere
  - restrained_camera_motion_in_film
forbidden_changes:
  - camera_jump
  - room_relayout
  - move_major_wall
  - resize_or_move_opening
  - flip_stair_direction
  - change_floor_level
  - replace_core_anchor
presentation_principles:
  mobile_social:
    when_ratio: ["9:16", "4:5"]
    single_frame: "one independent image per stage"
    sequence: "5 or N images in one horizontal row"
    preserve_individual_ratio: true
    forbidden: ["merge_into_one_image", "crop", "stretch"]
input_matching:
  source: "customer_space_description"
  mode: "local_keyword_match"
  fields: ["project_name", "space_type", "space_style"]
  manual_override: "preserve_customer_selection"
  unclear_match: "keep_current_default"
